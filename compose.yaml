services:
  detect-doc:
    image: detect-doc:local
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Flowise__BaseUrl: ${Flowise__BaseUrl:?Flowise__BaseUrl requis}
      Flowise__FlowId: ${Flowise__FlowId:?Flowise__FlowId requis}
      Flowise__AllowInvalidTls: ${Flowise__AllowInvalidTls:-false}
    restart: unless-stopped
