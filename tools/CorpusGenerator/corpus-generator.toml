[corpus]
output_dir = "../../corpus"

[documents]
# Facture et devis a parite : c'est la paire confondable du corpus, et une matrice de
# confusion ne se lit que sur des effectifs comparables.
facture = 12
devis = 12
rib = 4
# La carte de visite ne produit qu'un fichier par entree : elle est reprise d'un carton
# physique, et sa numerisation remplace l'original au lieu de s'y ajouter. Compter donc
# une entree par unite ici, contre deux environ pour les autres types.
carte_visite = 10

[split]
dev_probability = 0.25

[degradation]
twin_probability = 0.55
dpi = 200
container_jpeg_quality = 88

[degradation.weights]
"scan-propre" = 45
"scan-degrade" = 30
"photo-smartphone" = 15
fax = 5
photocopie = 5
