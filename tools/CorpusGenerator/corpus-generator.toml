[corpus]
output_dir = "../../corpus"

[documents]
# Nombre de documents écrits au manifest pour chaque type, jumeaux scannés compris. La
# facture, le devis et les trois types bancaires donnent une ou deux entrées par unité
# générée, selon la règle de dédoublement plus bas : le générateur produit autant d'unités
# qu'il en faut pour tomber sur le compte demandé.
#
# Facture et devis à parité, et les trois voisins bancaires à parité entre eux : ce sont
# les groupes confondables du corpus, et une matrice de confusion ne se lit que sur des
# effectifs comparables.
facture = 12
devis = 12
rib = 8
sepa = 8
rib_sepa = 8
# Les trois types suivants produisent une seule entrée par unité, leur effectif se lit
# donc aussi comme un nombre de mises en page couvertes. Douzes cartes de visite et douzes
# feuilles couvrent deux fois chacune de leurs cinq structures et plus, quinze offres couvrent
# trois fois chacun des cinq templates de site.
carte_visite = 12
feuille_emar = 15
offre_emploi = 15

[split]
# Une unité sur N part dans le jeu de réglage, dans chaque type pris séparément. Le jeu
# dev est le seul qu'on s'autorise à ouvrir document par document : chaque type doit y
# être présent, sans quoi ses règles se règlent sans en avoir lu un seul exemplaire.
dev_every = 4

[degradation]
# Une unité sur N se dédouble en un jumeau scanné du même contenu. Le rang décide, pas un
# tirage : chaque type porte ainsi la même proportion de documents scannés, et le nombre
# de paires disponibles pour chiffrer le coût de l'OCR est connu avant la génération.
# La part de documents scannés qui en découle vaut 1 / (1 + N) : 50 % à 1, où chaque
# document a son jumeau, 33 % à 2, 25 % à 3.
twin_every = 2
dpi = 200
container_jpeg_quality = 88

[degradation.weights]
"scan-propre" = 45
"scan-degrade" = 30
"photo-smartphone" = 15
fax = 5
photocopie = 5
